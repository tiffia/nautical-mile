apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: learning-tracker-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/tiffia/nautical-mile.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: destination
  syncPolicy:
    automated:
      prune: true
      selfHeal: true