
<!DOCTYPE html>
<html>
<head>
    <title>DevOps Learning Tracker</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto;
        padding: 0 20px; }
        input[type=
        "text"] { width: 70%; padding: 8px; }
        button { padding: 8px 16px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #ddd; display: flex; justify-content:
        space-between; }
        .completed { text-decoration: line-through; color: #888; }
    </style>
</head>
<body>
    <h2>GitOps & DevOps Learning Milestones</h2>
    <form action="/add" method="POST">
        <input type="text" name="title" placeholder="e.g. Master Argo CD Sync Policies" required>
        <button type="submit">Add Goal</button>
    </form>
    <ul>
        {% for id, title, status in skills %}
        <li>
            <span class="{{ 'completed' if status =='Completed' else '' }}">{{ title }} ({{status }})</span>
            <a href="/toggle/{{ id }}">Mark as {{ 'Incomplete' if status =='Completed' else'Done' }}</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
